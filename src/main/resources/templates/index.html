<!DOCTYPE html>
<html
	lang="ja"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>トップ</title>
	</head>
	<body>
		<header>
			<p>
				ようこそ、<span th:text="${loginUser.displayName}">ユーザー名</span>さん
			</p>
			
			<form th:action="@{/logout}" method="post">
				<button type="submit">ログアウト</button>
			</form>
		</header>
		<main>
			<h1>トップ画面だ</h1>
			
			<dl>
				<dt>ユーザーID</dt>
				<dd th:text="${loginUser.userId}">1</dd>
				
				<dt>メールアドレス</dt>
				<dd th:text="${loginUser.username}">user@example.com</dd>
				
				<dt>表示名</dt>
				<dd th:text="${loginUser.displayName}">ユーザー</dd>
				
				<dt>権限</dt>
				<dd>
					<ul>
						<li th:each="authority : ${loginUser.authorities}"
							th:text="${authority.authority}">ROLE_USER</li>
					</ul>
				</dd>
			</dl>
			
			<a th:href="@{/admin}" sec:authorize="hasRole('ADMIN')">
			    管理画面
			</a>
		</main>
	</body>
</html>
