<!DOCTYPE html>
<html
	lang="ja"
	xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta
		name="viewport"
		content="width=device-width, initial-scale=1.0">
	<title>ユーザー登録</title>
</head>
<body>
	<header>
		<a th:href="@{/login}">
			ログイン画面へ戻る
		</a>
	</header>
	
	<main>
		<h1>ユーザー登録</h1>
		
		<form
			th:action="@{/signup}"
			th:object="${signupForm}"
			method="post">
			
			<div>
				<label for="email">メールアドレス</label>
				<input
					id="email"
					type="email"
					th:field="*{email}"
					autocomplete="email"
					maxlength="255"
					required>
                <p
					th:if="${#fields.hasErrors('email')}"
					th:errors="*{email}">
					メールアドレスのエラー
				</p>
			</div>
			
			<div>
				<label for="displayName">表示名</label>
				<input
					id="displayName"
					type="text"
					th:field="*{displayName}"
					autocomplete="name"
					maxlength="100"
					required>
				<p
					th:if="${#fields.hasErrors('displayName')}"
					th:errors="*{displayName}">
					表示名のエラー
				</p>
			</div>
			
			<div>
				<label for="password">パスワード</label>
				<input
					id="password"
					type="password"
					th:field="*{password}"
					autocomplete="new-password"
					minlength="8"
					maxlength="72"
					required>
                <p
					th:if="${#fields.hasErrors('password')}"
					th:errors="*{password}">
					パスワードのエラー
				</p>
			</div>
			
			<div>
				<label for="passwordConfirmation">パスワード確認</label>
				<input
					id="passwordConfirmation"
					type="password"
					th:field="*{passwordConfirmation}"
					autocomplete="new-password" 
					minlength="8"
					maxlength="72"
					required>
				<p
					th:if="${#fields.hasErrors('passwordConfirmation')}"
					th:errors="*{passwordConfirmation}">
					確認用パスワードのエラー
				</p>
			</div>
			
			<button type="submit">登録</button>
		</form>
	</main>
</body>
</html>
